name: Deploy Agents (A2A)
on:
  push:
    branches:
      - main

# Shared configuration for all agents
env:
  PROJECT_ID: lab-experiments-514316   # Project name: lab-experiments
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  AR_REPO: agent2agent            # Single Artifact Registry repo for all agents
  SERVICE_ACCOUNT: agent2agent@lab-experiments-514316.iam.gserviceaccount.com   # Cloud Run runtime SA for all agents
  PROJECT_NUMBER: '115741533268'  # Service URLs: https://<service>-<PROJECT_NUMBER>.<REGION>.run.app

jobs:
  # Detect which agents changed in this push
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      agents: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # To add an agent: add a block named after its folder.
          # If this workflow changes, all agents are redeployed.
          filters: |
            buyer-agent:
              - 'buyer-agent/**'
              - '.github/workflows/deploy.yml'
            supplier-agent:
              - 'supplier-agent/**'
              - '.github/workflows/deploy.yml'
            referee-agent:
              - 'referee-agent/**'
              - '.github/workflows/deploy.yml'

  # Sync GitHub secrets into GCP Secret Manager (create if missing, add a new version only if the value changed)
  sync-secrets:
    needs: changes
    if: needs.changes.outputs.agents != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Sync secrets to Secret Manager
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then echo "::error::GitHub secret $name is empty or missing"; exit 1; fi
            if ! gcloud secrets describe "$name" --project="$PROJECT_ID" >/dev/null 2>&1; then
              printf '%s' "$value" | gcloud secrets create "$name" --project="$PROJECT_ID" \
                --replication-policy=automatic --data-file=-
              echo "Created secret $name"
            elif [ "$(gcloud secrets versions access latest --secret="$name" --project="$PROJECT_ID")" != "$value" ]; then
              printf '%s' "$value" | gcloud secrets versions add "$name" --project="$PROJECT_ID" --data-file=-
              echo "Added new version of $name"
            else
              echo "$name is up to date"
            fi
          }
          # To add a secret: map it in this step's env and add a sync_secret line
          sync_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"

  deploy:
    needs: [changes, sync-secrets]
    if: needs.changes.outputs.agents != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Convention: folder name = image name = Cloud Run service name
        agent: ${{ fromJSON(needs.changes.outputs.agents) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${PROJECT_ID}/${AR_REPO}/${{ matrix.agent }}" >> "$GITHUB_ENV"

      # 1. Authentication
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Build image (from the agent folder)
      - name: Build Docker image (${{ matrix.agent }})
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            ${{ matrix.agent }} --load

      # 3. Push image to Artifact Registry
      - name: Push Docker image to Artifact Registry (${{ matrix.agent }})
        run: docker push --all-tags ${{ env.IMAGE }}

      # 4. Deploy to Cloud Run with per-agent configuration
      - name: Deploy to Cloud Run (${{ matrix.agent }})
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          url_of() { echo "https://$1-${PROJECT_NUMBER}.${REGION}.run.app"; }
          AGENT_URL="$(url_of "$AGENT")"

          # Per-agent settings. To add an agent: add a case branch (and a paths filter above).
          EXTRA_FLAGS=()
          case "$AGENT" in
            buyer-agent)
              ENV_VARS="AGENT_URL=${AGENT_URL},SUPPLIER_AGENT_URL=$(url_of supplier-agent),REFEREE_AGENT_URL=$(url_of referee-agent),USE_ID_TOKEN=false"
              EXTRA_FLAGS+=(--set-secrets="ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest")
              EXTRA_FLAGS+=(--timeout=900)   # a full negotiation spans several LLM calls per round
              ;;
            supplier-agent)
              # Gemini through Vertex AI with the runtime service account: no API key.
              ENV_VARS="AGENT_URL=${AGENT_URL},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global"
              EXTRA_FLAGS+=(--clear-secrets)
              EXTRA_FLAGS+=(--max-instances=1)   # negotiation history is kept in memory per context_id
              ;;
            referee-agent)
              ENV_VARS="AGENT_URL=${AGENT_URL}"
              EXTRA_FLAGS+=(--set-secrets="ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest")
              ;;
            *)
              echo "::error::No deploy configuration for agent '$AGENT'"; exit 1 ;;
          esac

          gcloud run deploy "$AGENT" \
            --image="${IMAGE}:${{ github.sha }}" \
            --platform=managed \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --allow-unauthenticated \
            --memory=256Mi \
            --execution-environment=gen1 \
            --cpu=1 \
            --concurrency=16 \
            --service-account="$SERVICE_ACCOUNT" \
            --set-env-vars="$ENV_VARS" \
            "${EXTRA_FLAGS[@]}"
